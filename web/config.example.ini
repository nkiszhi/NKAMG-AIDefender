[server]
host = 127.0.0.1
port = 5006
cors_origins = *
max_upload_size = 1073741824
# CPU 33-model service: keep one inference running; other requests wait internally.
max_concurrent_scans = 1
max_queued_scans = 8
task_ttl_seconds = 3600
# >= 100 MiB: exclusive inference; FIFO prevents large-task starvation.
large_sample_bytes = 104857600
max_queue_wait_seconds = 1800

[uploads]
# Effective file limit is the smaller of this and server.max_upload_size.
# Maximum supported file size: 1 GiB.
max_file_size = 1073741824
min_free_disk_bytes = 536870912
orphan_ttl_seconds = 3600
# Total body transfer deadline, for browser and API uploads (not inference).
api_upload_timeout_seconds = 600
# Abort an unfinished upload only after this many seconds without new body bytes.
# This timer stops when the request body is complete; it never times inference.
api_upload_idle_timeout_seconds = 60

[paths]
upload_dir = FastAPI/uploads

[codefender]
api_base = http://127.0.0.1:8001
# web: existing compatibility/stream API. development: new diagnostic API,
# e.g. http://127.0.0.1:18002 (enable CODEFENDER_ENABLE_DEV_API=1 in engine).
# Changing CODEFENDER_ENV alone does not select the development response.
response_contract = web
# Optional isolated workers, e.g. http://127.0.0.1:8001,http://127.0.0.1:8002
# Set server.max_concurrent_scans=2 only after both services pass real PE tests.
api_bases =
scan_endpoint =
predict_endpoint = /predict-single
include_de = true
timeout = 450
threshold = 0.5
host_path_prefix =
container_path_prefix =
# Enable with the separately running read-only host monitor. Never mount the
# Docker socket into Web. Missing/stale configured monitor pauses dispatch.
resource_monitor_path =
resource_monitor_stale_seconds = 15
min_available_memory_bytes = 4294967296
# Change when weights, model code, analysis options or resource budget change.
model_revision = deployment-v1
# Must exceed the model's enforced HARD execution lifetime. HTTP timeouts do
# not cancel inference; use >=1200 only when model hard lifetime <=960 sec.
recovery_timeout_seconds = 1200

[docker]
container_name = codefender-c3-v8
container_upload_dir = /tmp/codefender_uploads

[mysql]
host =
port = 3306
user =
passwd =
# Keep the legacy PE database until AIDefender_PE membership is fully accepted.
pe_lookup_db = malicious_pe
; Switch only after the replicated URL display snapshot has been verified.
domain_stats_mode = legacy
malicious_dbs = malicious_elf,malicious_pe,malicious_others
benign_dbs = benign_elf,benign_pe,benign_others
db = av_scan_history
db_web = webdatadb
db_stats = sample_stats
db_domain = domain
