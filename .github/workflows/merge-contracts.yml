name: main-test-lm-contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/main-test-lm-integration]
permissions:
  contents: read
jobs:
  merge-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: CoDefenderC3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies (no production weights)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tests/requirements-merge.txt
      - name: Freeze, HTTP contracts, IR, and unmodified Web regression
        run: python -B tools/run_merge_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-evidence-${{ matrix.os }}
          path: CoDefenderC3/docs/test-records/main_test_lm_merge_2026-11-10.json
