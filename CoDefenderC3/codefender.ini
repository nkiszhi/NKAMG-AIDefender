[program:codefender]
command=/app/start_codefender.sh
directory=/app
priority=1
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0
stopsignal=KILL
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/var/log/supervisor/codefender.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/codefender_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; environment= 里的值会**覆盖**容器 ENV，是运维实际要改的那一处。
; 生产档位（全引擎、不许纯模型）的关键三项：
;   CODEFENDER_ENV=prod              → 不读 runtime_config.json（开发期开关进不了生产）
;   CODEFENDER_REQUIRE_HASH_DB=1     → 签名库缺一即拒绝启动（响的失败，不是静默降级）
;   CODEFENDER_HASH_DB_ENABLED=1 / CODEFENDER_FUZZY_DB_ENABLED=1 → 显式开启预检
; 签名库目录默认 /app/signatures，三族库已在**构建期**打进镜像 → docker run **不需任何 -v**：
;   · 不要挂 /app/signatures（挂卷会让容器读到与镜像版本脱钩的旧库）
;   · 严禁挂 VMware 共享目录 hgfs（SQLite 分片库的 POSIX 锁在 hgfs 上不可靠）
; 临时纯模型对照：把下面 REQUIRE_HASH_DB 与 HASH_DB_ENABLED 改成 0 后
;   supervisorctl restart codefender   （或直接 POST /admin/config，内存内生效、重启即恢复）
environment=CODEFENDER_MODEL_PATH="/app/ensemble.pkl",THRESHOLD="0.5",HOST="0.0.0.0",PORT="8000",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1",CODEFENDER_ENV="prod",CODEFENDER_RUNTIME_CFG_DISABLE="1",CODEFENDER_HASH_DB_ENABLED="1",CODEFENDER_FUZZY_DB_ENABLED="1",CODEFENDER_REQUIRE_HASH_DB="1"
