[program:codefender]
command=/app/start_codefender.sh
directory=/app
priority=1
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0
stopsignal=KILL
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/var/log/supervisor/codefender.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/codefender_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; environment= 里的值会**覆盖**容器 ENV，是运维实际要改的那一处。
;
; SMDA 测评镜像的关键设置：
;   CODEFENDER_DISASM_BACKEND 默认由启动层设为 smda；继承容器显式 bn（需安装并授权 BN）。
;   CODEFENDER_ANALYSIS_TIMEOUT=600   → 单样本 BN/SMDA 分析预算（秒）；超时优雅降级而非 504
;   CODEFENDER_REQUEST_TIMEOUT=900   → 请求级超时（必须 > 分析超时）
;   CODEFENDER_HARD_TIMEOUT=960      → 硬杀兜底（必须 > 请求超时）
;   CODEFENDER_MAX_CONCURRENT=8       → 并发扫描数
;   CODEFENDER_HASH_DB_ENABLED=0      → 关闭哈希预检：所有样本都真正走模型
;   CODEFENDER_FUZZY_DB_ENABLED=0     → 同上
;   CODEFENDER_REQUIRE_HASH_DB=0      → 本镜像**不含签名库**，不因缺库拒绝启动
;   CODEFENDER_MASK_VIEWS=""        -> 推理期视图掩码开关（实验 A）。
;                                   置 "V6_opcode_stat" 时，把该视图内的哈希依赖特征段
;                                   （D02/D03）整段置零，模型只能依赖未受污染的真实维
;                                   （D04 指令类别分布 / D05 函数统计 / D06 基本块统计）。
;                                   留空 = 关闭（默认）。仅影响推理期视图拼装：不改权重、
;                                   不改视图维度，可随时开关做 A/B 对比。
environment=CODEFENDER_MODEL_PATH="/app/ensemble.pkl",THRESHOLD="0.5",HOST="0.0.0.0",PORT="8000",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1",CODEFENDER_ENV="prod",CODEFENDER_RUNTIME_CFG_DISABLE="1",CODEFENDER_ANALYSIS_TIMEOUT="600",CODEFENDER_REQUEST_TIMEOUT="900",CODEFENDER_HARD_TIMEOUT="960",CODEFENDER_MAX_CONCURRENT="8",BN_WORKER_THREADS="8",CODEFENDER_HASH_DB_ENABLED="0",CODEFENDER_FUZZY_DB_ENABLED="0",CODEFENDER_REQUIRE_HASH_DB="0",CODEFENDER_MASK_VIEWS=""
