; CPU + SMDA + embedded SHA256/MD5/fuzzy production service.
; No BN licence or CUDA is required. Shared listeners use one model process.
; Critical flags below override same-name docker run -e values intentionally.
; Timeouts, CODEFENDER_MAX_CONCURRENT and listener addresses inherit Docker ENV.
[program:codefender]
command=/app/start_codefender.sh
directory=/app
priority=1
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=false
stdout_logfile=/var/log/supervisor/codefender.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/codefender_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=CODEFENDER_MODEL_PATH="/app/ensemble.pkl",CODEFENDER_HASH_DB_DIR="/app/signatures",CODEFENDER_ENV="prod",CODEFENDER_RUNTIME_CFG_DISABLE="1",CODEFENDER_DISASM_BACKEND="smda",CODEFENDER_MODEL_DEVICE="cpu",CODEFENDER_MALGRAPH_DEVICE="cpu",CODEFENDER_HASH_DB_ENABLED="1",CODEFENDER_FUZZY_DB_ENABLED="1",CODEFENDER_REQUIRE_HASH_DB="1"
