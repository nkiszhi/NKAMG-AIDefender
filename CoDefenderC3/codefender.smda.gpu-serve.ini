[program:codefender]
command=/app/start_codefender.sh
directory=/app
priority=1
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0
stopsignal=KILL
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/var/log/supervisor/codefender.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/codefender_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; ── SMDA + CUDA GPU · 线上生产版（哈希预检全开）─────────────────────────────
;   CODEFENDER_DISASM_BACKEND 默认由启动层设为 smda；继承容器显式 bn（需安装并授权 BN）。
;   CODEFENDER_ANALYSIS_TIMEOUT=600  单样本反汇编预算（秒）；超时降级而非 504
;   CODEFENDER_REQUEST_TIMEOUT=900   请求级超时（必须 > 分析超时）
;   CODEFENDER_HARD_TIMEOUT=960      硬中断兜底（必须 > 请求超时）
;   CODEFENDER_MAX_CONCURRENT=8       并发扫描数（每个 worker 会各占一份 CUDA 上下文，
;                                     显存紧张时降到 4，或设 CODEFENDER_MODEL_DEVICE=cpu）
;   CODEFENDER_MODEL_DEVICE=cuda      推理设备：auto|cuda|cuda:N|cpu（cuda 不可用自动降级 CPU）
;   CODEFENDER_MALGRAPH_DEVICE=cuda   MalGraph 专用设备（同上）
;   CODEFENDER_MASK_VIEWS=""          推理期哈希特征掩码（留空=关闭）
;
;   哈希预检三项（HASH_DB_ENABLED / FUZZY_DB_ENABLED / REQUIRE_HASH_DB）**刻意不写这里**：
;   supervisord 的 environment= 会覆盖同名变量，写死就 docker run -e 也改不动。
;   本镜像由 Dockerfile 的 ENV 提供 —— serve 版为 1/1/1（上线：命中签名库直接短路返回；
;   REQUIRE_HASH_DB=1 表示签名库缺失/损坏时**拒绝启动**，响的失败优于静默降级）。
environment=CODEFENDER_MODEL_PATH="/app/ensemble.pkl",THRESHOLD="0.5",HOST="0.0.0.0",PORT="8000",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1",CODEFENDER_ENV="prod",CODEFENDER_RUNTIME_CFG_DISABLE="1",CODEFENDER_ANALYSIS_TIMEOUT="600",CODEFENDER_REQUEST_TIMEOUT="900",CODEFENDER_HARD_TIMEOUT="960",CODEFENDER_MAX_CONCURRENT="8",BN_WORKER_THREADS="8",CODEFENDER_MODEL_DEVICE="cuda",CODEFENDER_MALGRAPH_DEVICE="cuda",CODEFENDER_MASK_VIEWS=""
